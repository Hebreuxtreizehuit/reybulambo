<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Post | Rey Bulambo</title>
<style>
body{font-family:Arial;background:#0b0b0f;color:white;padding:40px}
article{background:#15151d;padding:30px;border-radius:12px;max-width:800px}
</style>
</head>

<body>

<a href="blog.html">← Back to Blog</a>

<article id="post"></article>

<script>
const slug = new URLSearchParams(window.location.search).get("slug");

fetch("posts.json")
.then(res => res.json())
.then(posts => {

 const post = posts.find(p=>p.slug === slug);
 const container = document.getElementById("post");

 if(!post){
   container.innerHTML = "<h1>Post not found</h1>";
   return;
 }

 container.innerHTML = `
   <h1>${post.title}</h1>
   <p>${post.date}</p>
   <p>${post.body}</p>
 `;
});
</script>

</body>
</html>
