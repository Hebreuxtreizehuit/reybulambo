<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog | Rey Bulambo</title>
<style>
body{
  font-family:Arial;
  background:#0b0b0f;
  color:white;
  padding:48px;
}

h1{
  font-size:42px;
  margin-bottom:28px;
}

#posts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:28px;
}

.post{
  background:#15151d;
  border-radius:22px;
  overflow:hidden;
  max-width:900px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.post img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

.post h2,
.post p,
.post a{
  margin-left:28px;
  margin-right:28px;
}

.post h2{
  margin-top:26px;
  font-size:28px;
}

.post a{
  display:inline-block;
  margin-bottom:28px;
  color:#d6ad60;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>
<body>

<h1>Blog</h1>
<div id="posts"></div>

<script>
fetch("posts.json")
.then(res => res.json())
.then(posts => {
  const box = document.getElementById("posts");

  posts.forEach(post => {
    box.innerHTML += `
  <div class="post">
    <img src="${post.image}" alt="${post.title}">
    <h2>${post.title}</h2>
    <p>${post.date}</p>
    <p>${post.excerpt}</p>
    <a href="post.html?slug=${post.slug}">Read more</a>
  </div>
`;
  });
});
</script>

</body>
</html>
