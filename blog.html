<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog | Rey Bulambo</title>
<style>
body{font-family:Arial;background:#0b0b0f;color:white;padding:40px}
.post{background:#15151d;padding:24px;border-radius:14px;margin-bottom:20px;max-width:800px}
a{color:#d6ad60;text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<h1>Blog</h1>
<div id="posts"></div>

<script>
fetch("posts.json")
.then(res => res.json())
.then(posts => {
  const box = document.getElementById("posts");

  posts.forEach(post => {
    box.innerHTML += `
      <div class="post">
        <h2>${post.title}</h2>
        <p>${post.date}</p>
        <p>${post.excerpt}</p>
        <a href="post.html?slug=${post.slug}">Read more</a>
      </div>
    `;
  });
});
</script>

</body>
</html>
